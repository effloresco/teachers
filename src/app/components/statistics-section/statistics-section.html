<section id="statistics">
    <h2>Statistics</h2>

    <div class="switch-container">
        <span class="view-options">Table</span>
        <label class="switch">
            <input type="checkbox" [checked]="chartView" (change)="switchClick($event)">
            <span class="slider round"></span>
        </label>
        <span class="view-options">Chart</span>
    </div>

    @if (!chartView) {
        <app-webdatarocks-view />
    } @else {
        <app-chart-view />
    }
</section>
